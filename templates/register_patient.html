{% load static %}
<!DOCTYPE html>
<html>
<head>
    <title>Patient Registration - Smart Health Center</title>
    <link rel="stylesheet" href="{% static 'css/bootstrap.min.css' %}">
</head>
<body style="background: #f4f7f6; padding: 40px 0;">
    <div class="container">
        <div class="row">
            <div class="col-md-6 col-md-offset-3">
                <div class="panel panel-default" style="box-shadow: 0 4px 10px rgba(0,0,0,0.08);">
                    <div class="panel-heading text-center" style="background:#a5c422; color:#fff;">
                        <h4>Patient Registration</h4>
                    </div>
                    <div class="panel-body" style="padding: 25px;">
                        {% if error %}<div class="alert alert-danger">{{ error }}</div>{% endif %}
                        <form method="POST">
                            {% csrf_token %}
                            <div class="form-group"><label>Username</label><input type="text" name="username" class="form-control" required></div>
                            <div class="form-group"><label>Email</label><input type="email" name="email" class="form-control" required></div>
                            <div class="form-group"><label>Password</label><input type="password" name="password" class="form-control" required></div>
                            <div class="form-group"><label>Phone Number</label><input type="text" name="phone" class="form-control" required></div>
                            <div class="row">
                                <div class="col-md-4">
                                    <div class="form-group"><label>Age</label><input type="number" name="age" class="form-control" required></div>
                                </div>
                                <div class="col-md-4">
                                    <div class="form-group">
                                        <label>Gender</label>
                                        <select name="gender" class="form-control" required>
                                            <option value="Male">Male</option>
                                            <option value="Female">Female</option>
                                            <option value="Other">Other</option>
                                        </select>
                                    </div>
                                </div>
                                <div class="col-md-4">
                                    <div class="form-group"><label>Blood Group</label><input type="text" name="blood_group" placeholder="e.g. O+" class="form-control"></div>
                                </div>
                            </div>
                            <button type="submit" class="btn btn-block" style="background:#a5c422; color:#fff; font-weight:bold;">Register as Patient</button>
                        </form>
                    </div>
                    <div class="panel-footer text-center">
                        <small>Already registered? <a href="{% url 'login' %}?role=patient">Sign in here</a></small>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
