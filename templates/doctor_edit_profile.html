{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Edit Doctor Profile</title>
    <link rel="stylesheet" href="{% static 'css/bootstrap.min.css' %}">
    <link rel="stylesheet" href="{% static 'css/font-awesome.min.css' %}">
</head>
<body style="background: #f4f7f6; padding: 40px 0;">
    <div class="container">
        <div class="row">
            <div class="col-md-8 col-md-offset-2">
                <div class="panel panel-default" style="border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.06);">
                    <div class="panel-heading" style="background: #fff; padding: 20px;">
                        <h3 class="panel-title" style="font-weight: bold; font-size: 18px;">
                            <i class="fa fa-user-md" style="color: #a5c422;"></i> Update Doctor Profile
                        </h3>
                    </div>
                    <div class="panel-body" style="padding: 25px;">
                        <form method="post">
                            {% csrf_token %}
                            
                            <div class="row">
                                <div class="col-md-6 form-group">
                                    <label>First Name</label>
                                    <input type="text" name="first_name" class="form-control" value="{{ doctor.user.first_name }}">
                                </div>
                                <div class="col-md-6 form-group">
                                    <label>Last Name</label>
                                    <input type="text" name="last_name" class="form-control" value="{{ doctor.user.last_name }}">
                                </div>
                            </div>

                            <div class="form-group">
                                <label>Email Address</label>
                                <input type="email" name="email" class="form-control" value="{{ doctor.user.email }}">
                            </div>

                            <div class="row">
                                <div class="col-md-6 form-group">
                                    <label>Department</label>
                                    <select name="department" class="form-control" required>
                                        {% for dept in departments %}
                                            <option value="{{ dept.id }}" {% if dept.id == doctor.department.id %}selected{% endif %}>
                                                {{ dept.name }}
                                            </option>
                                        {% endfor %}
                                    </select>
                                </div>
                                <div class="col-md-6 form-group">
                                    <label>Qualification</label>
                                    <input type="text" name="qualification" class="form-control" value="{{ doctor.qualification }}" required>
                                </div>
                            </div>

                            <div class="row">
                                <div class="col-md-4 form-group">
                                    <label>Experience (Years)</label>
                                    <input type="number" name="experience_years" class="form-control" value="{{ doctor.experience_years }}" min="0" required>
                                </div>
                                <div class="col-md-4 form-group">
                                    <label>Consultation Fee ($)</label>
                                    <input type="number" step="0.01" name="consultation_fee" class="form-control" value="{{ doctor.consultation_fee }}" required>
                                </div>
                                <div class="col-md-4 form-group">
                                    <label>Room Number / Cabin</label>
                                    <input type="text" name="room_number" class="form-control" value="{{ doctor.room_number|default:'' }}">
                                </div>
                            </div>

                            <div class="form-group">
                                <label>Hospital / Clinic Name</label>
                                <input type="text" name="clinic_name" class="form-control" value="{{ doctor.clinic_name }}" required>
                            </div>

                            <div class="form-group">
                                <label>Hospital / Clinic Address</label>
                                <input type="text" name="clinic_address" class="form-control" value="{{ doctor.clinic_address|default:'' }}">
                            </div>

                            <div style="margin-top: 20px;">
                                <button type="submit" class="btn btn-success" style="background: #a5c422; border: none; font-weight: bold;">
                                    Save Changes
                                </button>
                                <a href="{% url 'doctor_dashboard' %}" class="btn btn-default">Cancel</a>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
