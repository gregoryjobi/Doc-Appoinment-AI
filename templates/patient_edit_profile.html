{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Profile - Smart Health Center</title>
    <link rel="stylesheet" href="{% static 'css/bootstrap.min.css' %}">
    <link rel="stylesheet" href="{% static 'css/font-awesome.min.css' %}">
    <style>
        body { background-color: #f4f7f6; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        .edit-card { background: #fff; border-radius: 10px; border: 1px solid #e2e8f0; padding: 30px; box-shadow: 0 2px 6px rgba(0,0,0,0.05); }
    </style>
</head>
<body style="padding: 40px 0;">
    <div class="container">
        <div class="row">
            <div class="col-md-8 col-md-offset-2">
                <div class="edit-card">
                    <div style="border-bottom: 1px solid #e2e8f0; padding-bottom: 15px; margin-bottom: 25px;">
                        <h3 style="margin: 0; font-weight: 700;">
                            <i class="fa fa-user-circle" style="color: #a5c422;"></i> Update Patient Profile
                        </h3>
                    </div>

                    <form method="post">
                        {% csrf_token %}

                        <div class="row">
                            <div class="col-md-6 form-group">
                                <label>First Name</label>
                                <input type="text" name="first_name" class="form-control" value="{{ patient.user.first_name }}" placeholder="First Name">
                            </div>
                            <div class="col-md-6 form-group">
                                <label>Last Name</label>
                                <input type="text" name="last_name" class="form-control" value="{{ patient.user.last_name }}" placeholder="Last Name">
                            </div>
                        </div>

                        <div class="row">
                            <div class="col-md-6 form-group">
                                <label>Email Address</label>
                                <input type="email" name="email" class="form-control" value="{{ patient.user.email }}" placeholder="Email Address">
                            </div>
                            <div class="col-md-6 form-group">
                                <label>Contact Phone</label>
                                <input type="text" name="phone" class="form-control" value="{{ patient.phone }}" placeholder="Phone Number" required>
                            </div>
                        </div>

                        <div class="row">
                            <div class="col-md-4 form-group">
                                <label>Age</label>
                                <input type="number" name="age" class="form-control" value="{{ patient.age }}" min="1" max="120" required>
                            </div>
                            <div class="col-md-4 form-group">
                                <label>Gender</label>
                                <select name="gender" class="form-control" required>
                                    <option value="Male" {% if patient.gender == "Male" %}selected{% endif %}>Male</option>
                                    <option value="Female" {% if patient.gender == "Female" %}selected{% endif %}>Female</option>
                                    <option value="Other" {% if patient.gender == "Other" %}selected{% endif %}>Other</option>
                                </select>
                            </div>
                            <div class="col-md-4 form-group">
                                <label>Blood Group</label>
                                <input type="text" name="blood_group" class="form-control" value="{{ patient.blood_group|default:'' }}" placeholder="e.g. O+, A+, B-">
                            </div>
                        </div>

                        <div style="margin-top: 25px;">
                            <button type="submit" class="btn btn-primary" style="background: #a5c422; border: none; font-weight: 600; padding: 10px 24px;">
                                Save Profile Changes
                            </button>
                            <a href="{% url 'patient_dashboard' %}" class="btn btn-default" style="padding: 10px 20px;">Cancel</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
