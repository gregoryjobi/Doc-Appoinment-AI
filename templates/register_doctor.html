{% load static %}
<!DOCTYPE html>
<html>
<head>
    <title>Doctor Registration - Smart Health Center</title>
    <link rel="stylesheet" href="{% static 'css/bootstrap.min.css' %}">
</head>
<body style="background: #f4f7f6; padding: 40px 0;">
    <div class="container">
        <div class="row">
            <div class="col-md-6 col-md-offset-3">
                <div class="panel panel-default" style="box-shadow: 0 4px 10px rgba(0,0,0,0.08);">
                    <div class="panel-heading text-center" style="background:#1a2a3a; color:#fff;">
                        <h4>Doctor / Specialist Onboarding</h4>
                    </div>
                    <div class="panel-body" style="padding: 25px;">
                        {% if error %}<div class="alert alert-danger">{{ error }}</div>{% endif %}
                        <form method="POST">
                            {% csrf_token %}
                            <div class="form-group"><label>Username (Login ID)</label><input type="text" name="username" class="form-control" required></div>
                            <div class="form-group"><label>Official Email</label><input type="email" name="email" class="form-control" required></div>
                            <div class="form-group"><label>Password</label><input type="password" name="password" class="form-control" required></div>
                            <!-- Hospital / Clinic Name -->
<div class="form-group">
    <label for="clinic_name">Hospital / Clinic / Medical Center</label>
    <div class="input-group">
        <span class="input-group-addon"><i class="fa fa-hospital-o"></i></span>
        <input type="text" 
               class="form-control" 
               id="clinic_name" 
               name="clinic_name" 
               placeholder="e.g. Apollo Hospital, Aster Medcity, City Care Clinic" 
               required>
    </div>
</div>
                            <div class="form-group">
                                <label>Clinical Department</label>
                                <select name="department" class="form-control" required>
                                    {% for dept in departments %}
                                        <option value="{{ dept.id }}">{{ dept.name }}</option>
                                    {% empty %}
                                        <option value="">No departments created yet (add in Django admin)</option>
                                    {% endfor %}
                                </select>
                            </div>
                            <div class="form-group"><label>Medical Qualification</label><input type="text" name="qualification" placeholder="e.g. MBBS, MD (Cardiology)" class="form-control" required></div>
                            <div class="row">
                                <div class="col-md-4">
                                    <div class="form-group"><label>Experience (Yrs)</label><input type="number" name="experience_years" class="form-control" required></div>
                                </div>
                                <div class="col-md-4">
                                    <div class="form-group"><label>Fee ($)</label><input type="number" step="0.01" name="consultation_fee" class="form-control" required></div>
                                </div>
                                <div class="col-md-4">
                                    <div class="form-group"><label>Room / Cabin</label><input type="text" name="room_number" placeholder="Cabin 204" class="form-control"></div>
                                </div>
                            </div>
                            <div class="alert alert-warning" style="font-size: 12px; margin-bottom: 15px;">
                                <i class="fa fa-info-circle"></i> Newly registered doctors must be verified by Hospital Admin before being listed publicly.
                            </div>
                            <button type="submit" class="btn btn-block" style="background:#1a2a3a; color:#fff; font-weight:bold;">Submit Doctor Application</button>
                        </form>
                    </div>
                    <div class="panel-footer text-center">
                        <small>Already registered? <a href="{% url 'login' %}?role=doctor">Doctor Sign In</a></small>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
